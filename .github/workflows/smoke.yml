name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    name: 冒烟（加载契约 + 三个工具真跑）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node test/smoke.mjs
